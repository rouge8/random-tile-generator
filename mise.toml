[tools]
prek = "latest"
python = "3.14.4"

[env]
_.python.venv = { path = ".venv", create = true }

UV_PREVIEW_FEATURES = "add-bounds"

[tasks.setup]
sources = ["pyproject.toml", "uv.lock"]
run = [
  "uv sync --active",
  "prek install",
]

[tasks.upgrade-deps]
run = "uv sync --upgrade --all-groups"

[tasks.test]
depends = ["setup"]
run = "tox"

[tasks.lint]
run = "prek run --all-files"
