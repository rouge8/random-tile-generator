[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python_template"
authors = [{name = "Andy Freeland", email = "andy@andyfreeland.net"}]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Private :: Do Not Upload",
]
dynamic = ["version", "description"]
requires-python = "~=3.14.0"

[dependency-groups]
dev = [
    "coverage==7.13.5",
    "mypy==1.20.2",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-randomly==4.1.0",
]

[project.urls]
Home = "https://github.com/rouge8/python-template"

[tool.hatch.version]
path = "src/python_template/__init__.py"

[tool.pytest]
minversion = "9.0"
addopts = [
  "-v",
  "-ra",
  "--strict-config",
  "--strict-markers",
]

[tool.mypy]
strict = true
allow_redefinition = true
warn_unreachable = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "B90",
  "D2",
  "D213",
  "D3",
  "D404",
  "C4",
  "UP",
  "ISC",
  "PGH",
  "RUF",
]
ignore = [
  # 1 blank line required before class docstring
  "D203",
  # Our docstring style allows for a multi-line summary, e.g.:
  #
  #"""
  # Prevent database use without the appropriate fixture/marker, used
  # automatically.
  #
  # Additional content goes here.
  #"""
  "D205",
  # Inverse of D213
  "D212",
  # Explicitly concatenated string should be implicitly concatenated
  "ISC003",
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
order-by-type = false

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false
